[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-upload-cli"
version = "0.1.0"
description = "Sync local video files to a YouTube account."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "youtube-upload-cli contributors" },
]
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "rich>=13.7.0",
]

[project.scripts]
youtube-upload-sync = "sync_youtube:main"

[tool.setuptools]
py-modules = ["sync_youtube"]
